<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#14181f" />
<title>Pedidos · Angie-line</title>
<style>
  :root {
    --ink: #1a1612;
    --muted: #6f675f;
    --line: #e7e1d8;
    --bg: #f3efe8;
    --card: #fff;
    --navy: #14181f;
    --orange: #e86a12;
    --green: #1d7a45;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    background: var(--navy);
    color: #fff;
    padding: 1rem 1.15rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  header h1 { margin: 0; font-size: 1.35rem; font-weight: 750; letter-spacing: -0.02em; }
  header p { margin: 0.15rem 0 0; color: #b7c0cc; font-size: 0.95rem; }
  .grow { flex: 1; }
  button { font: inherit; border: 0; border-radius: 12px; cursor: pointer; font-weight: 750; }
  button.sound { background: var(--orange); color: #fff; padding: 0.75rem 0.95rem; }
  button.sound.on { background: #2a3140; color: #d5dbe6; }
  .flash {
    display: none;
    background: var(--orange);
    color: #fff;
    font-size: 1.25rem;
    font-weight: 800;
    text-align: center;
    padding: 0.8rem;
  }
  .flash.show { display: block; }
  main { padding: 1rem 1rem 2rem; max-width: 1200px; margin: 0 auto; }
  .tablero {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 0.9rem;
  }
  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 1rem 1rem 0.95rem;
    box-shadow: 0 10px 28px rgba(20, 24, 31, 0.06);
    display: flex;
    flex-direction: column;
    min-height: 220px;
  }
  .card.nuevo { outline: 3px solid #ffd7b8; }
  .top { display: flex; gap: 0.8rem; align-items: flex-start; }
  .num {
    flex: 0 0 auto;
    width: 3.1rem;
    height: 3.1rem;
    border-radius: 14px;
    background: var(--orange);
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 1.45rem;
    font-weight: 800;
  }
  .quien { font-size: 1.28rem; font-weight: 800; line-height: 1.15; }
  .tel {
    display: inline-block;
    margin-top: 0.2rem;
    color: var(--navy);
    font-size: 1.05rem;
    font-weight: 700;
    text-decoration: none;
  }
  .prod {
    margin: 0.85rem 0 0;
    font-size: 1.12rem;
    font-weight: 700;
    white-space: pre-line;
    line-height: 1.35;
  }
  .detalle { color: var(--muted); margin-top: 0.35rem; white-space: pre-line; }
  .hora { color: var(--muted); font-size: 0.9rem; margin-top: auto; padding-top: 0.7rem; }
  .card .entregar {
    width: 100%;
    margin-top: 0.8rem;
    background: var(--green);
    color: #fff;
    font-size: 1.05rem;
    min-height: 52px;
  }
  h2 { font-size: 0.95rem; color: var(--muted); margin: 1.3rem 0 0.6rem; font-weight: 750; }
  .vacio { text-align: center; color: var(--muted); font-size: 1.1rem; padding: 2.4rem 1rem; }
  .setup { background: var(--card); border-radius: 20px; padding: 1.1rem; }
  label { display: block; font-weight: 750; margin-bottom: 0.35rem; }
  input {
    width: 100%;
    font: inherit;
    font-size: 1.05rem;
    padding: 0.8rem;
    border-radius: 12px;
    border: 1px solid var(--line);
  }
  .hint { color: var(--muted); }
  button.primary { background: var(--navy); color: #fff; margin-top: 0.8rem; width: 100%; min-height: 52px; }
  footer { text-align: center; padding: 0 1rem 1.4rem; }
  button.link { background: transparent; color: var(--muted); }
  .err { color: #9d2a2a; font-weight: 700; }
</style>
</head>
<body>
<header>
  <div class="grow">
    <h1>Pedidos de hoy</h1>
    <p id="sub">Carnicería</p>
  </div>
  <button type="button" class="sound" id="btn-vista">Quejas</button>
  <button type="button" class="sound" id="btn-sonido">Activar sonido</button>
</header>
<div class="flash" id="flash">Llegó un pedido</div>
<main id="app"></main>
<footer><button type="button" class="link" id="btn-prueba">Probar aviso</button></footer>
<script>
const PROYECTO = "https://pambysjusmroryomhiwt.supabase.co";
const CLAVE_KEY = "angie-tablet-anon";
let clave = localStorage.getItem(CLAVE_KEY) || "";
let vista = "pedidos";
let sonido = false;
let conocidos = null;
let audioCtx = null;

const app = document.getElementById("app");
const sub = document.getElementById("sub");
const flash = document.getElementById("flash");
const btnSonido = document.getElementById("btn-sonido");

document.getElementById("btn-vista").onclick = () => {
  vista = vista === "pedidos" ? "quejas" : "pedidos";
  document.getElementById("btn-vista").textContent = vista === "pedidos" ? "Quejas" : "Pedidos";
  conocidos = null;
  cargar();
};

btnSonido.onclick = () => {
  sonido = true;
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  audioCtx.resume();
  tono();
  btnSonido.textContent = "Sonido listo";
  btnSonido.classList.add("on");
};

document.getElementById("btn-prueba").onclick = async () => {
  if (!clave) return alert("Primero pega la clave pública.");
  if (!sonido) btnSonido.click();
  const r = await api("pedidos_telefono", {
    method: "POST",
    body: JSON.stringify({
      nombre: "Pedido de prueba",
      telefono: "6140000000",
      producto: "1 kg de molida especial",
      detalle: "Aviso de prueba.",
      estado: "pendiente"
    })
  });
  if (!r.ok) alert(r.error || "No se pudo crear la prueba.");
  else cargar();
};

function tono() {
  if (!audioCtx) return;
  const ahora = audioCtx.currentTime;
  [0, 0.22, 0.44].forEach((t, i) => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "sine";
    o.frequency.value = i === 1 ? 740 : 880;
    g.gain.setValueAtTime(0.0001, ahora + t);
    g.gain.exponentialRampToValueAtTime(0.25, ahora + t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, ahora + t + 0.28);
    o.connect(g).connect(audioCtx.destination);
    o.start(ahora + t);
    o.stop(ahora + t + 0.3);
  });
}

function dia(iso) {
  return new Date(iso || Date.now()).toLocaleDateString("en-CA", { timeZone: "America/Chihuahua" });
}

function hora(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit", timeZone: "America/Chihuahua" });
}

function grupos(tel) {
  const d = String(tel || "").replace(/\D/g, "");
  const n = d.length > 10 ? d.slice(-10) : d;
  if (n.length !== 10) return tel || "";
  return n.slice(0, 3) + " " + n.slice(3, 6) + " " + n.slice(6);
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function api(path, opts = {}) {
  const res = await fetch(PROYECTO + "/rest/v1/" + path, {
    method: opts.method || "GET",
    headers: {
      apikey: clave,
      Authorization: "Bearer " + clave,
      "Content-Type": "application/json",
      Prefer: "return=minimal"
    },
    body: opts.body
  });
  if (!res.ok) {
    const t = await res.text();
    return { ok: false, error: t.slice(0, 180) || ("HTTP " + res.status) };
  }
  const txt = await res.text();
  let data = [];
  try { data = txt ? JSON.parse(txt) : []; } catch { data = []; }
  return { ok: true, data };
}

function pintarSetup(msg) {
  sub.textContent = "Falta la clave pública";
  app.innerHTML = `<div class="setup">
    <label>Clave pública de la cuenta provisional</label>
    <p class="hint">En Supabase: Project Settings → API Keys. Pega la clave <strong>anon</strong>. No pegues la clave secreta.</p>
    <input id="clave" autocomplete="off" placeholder="eyJ..." />
    <button class="primary" id="guardar-clave" type="button">Guardar y entrar</button>
    ${msg ? `<p class="err">${esc(msg)}</p>` : ""}
  </div>`;
  document.getElementById("guardar-clave").onclick = () => {
    const v = document.getElementById("clave").value.trim();
    if (!v) return;
    localStorage.setItem(CLAVE_KEY, v);
    clave = v;
    conocidos = null;
    cargar();
  };
}

function tarjeta(p, nueva) {
  const tel = String(p.telefono || "").replace(/\D/g, "");
  const telHtml = tel
    ? `<a class="tel" href="tel:${esc(tel)}">${esc(grupos(tel))}</a>`
    : `<div class="detalle">Sin teléfono</div>`;
  const num = p.numero != null ? esc(p.numero) : "–";
  return `<article class="card ${nueva ? "nuevo" : ""}">
    <div class="top">
      <div class="num">${num}</div>
      <div>
        <div class="quien">${esc(p.nombre || "Sin nombre")}</div>
        ${telHtml}
      </div>
    </div>
    <div class="prod">${esc(p.producto || "")}</div>
    ${p.detalle ? `<div class="detalle">${esc(p.detalle)}</div>` : ""}
    <div class="hora">${esc(hora(p.creado))}</div>
    <button class="entregar" type="button" data-id="${p.id}">Entregado</button>
  </article>`;
}

async function entregar(id) {
  const r = await api("pedidos_telefono?id=eq." + encodeURIComponent(id), {
    method: "PATCH",
    body: JSON.stringify({ estado: "entregado", entregado_en: new Date().toISOString() })
  });
  if (!r.ok) alert(r.error || "No se pudo marcar.");
  else cargar();
}

async function cargarQuejas() {
  const r = await api("quejas?select=*&order=creado.desc&limit=40");
  if (!r.ok) {
    sub.textContent = "Quejas";
    app.innerHTML = `<div class="vacio">Todavía no está el apartado de quejas.</div>`;
    return;
  }
  const rows = Array.isArray(r.data) ? r.data : [];
  const pend = rows.filter((q) => q.estado !== "revisada");
  sub.textContent = pend.length ? pend.length + (pend.length === 1 ? " queja pendiente" : " quejas pendientes") : "Sin quejas";
  app.innerHTML = pend.length ? `<div class="tablero">${pend.map((q) => `<article class="card">
    <div class="quien">${esc(q.nombre || "Sin nombre")}</div>
    <div class="detalle">${esc(q.telefono || "Sin teléfono")}</div>
    <div class="prod">${esc(q.queja || "")}</div>
    <div class="hora">${esc(hora(q.creado))}</div>
    <button class="entregar" type="button" data-id="${q.id}">Revisada</button>
  </article>`).join("")}</div>` : `<div class="vacio">Cuando alguien se queje por teléfono, aparece aquí.</div>`;
  app.querySelectorAll(".entregar").forEach((b) => {
    b.onclick = async () => {
      await api("quejas?id=eq." + encodeURIComponent(b.dataset.id), {
        method: "PATCH",
        body: JSON.stringify({ estado: "revisada" })
      });
      cargar();
    };
  });
}

async function cargar() {
  if (!clave) { pintarSetup(); return; }
  if (vista === "quejas") return cargarQuejas();
  const r = await api("pedidos_telefono?select=*&estado=eq.pendiente&order=numero.asc&limit=200");
  if (!r.ok) { pintarSetup("Esa clave no pudo leer los pedidos. Usa la clave pública, no la secreta."); return; }
  const rows = Array.isArray(r.data) ? r.data : [];
  const hoy = dia();
  const deHoy = rows.filter((p) => dia(p.creado) === hoy).sort((a, b) => (a.numero || 0) - (b.numero || 0));
  const otros = rows.filter((p) => dia(p.creado) !== hoy);
  const ids = new Set(deHoy.map((p) => p.id));
  let nuevos = new Set();
  if (conocidos) {
    for (const id of ids) if (!conocidos.has(id)) nuevos.add(id);
    if (nuevos.size) {
      flash.classList.add("show");
      if (sonido) tono();
      setTimeout(() => flash.classList.remove("show"), 4000);
    }
  }
  conocidos = ids;
  sub.textContent = deHoy.length ? deHoy.length + (deHoy.length === 1 ? " pendiente hoy" : " pendientes hoy") : "Sin pendientes hoy";
  app.innerHTML = `
    ${deHoy.length ? `<div class="tablero">${deHoy.map((p) => tarjeta(p, nuevos.has(p.id))).join("")}</div>` : `<div class="vacio">Cuando entre un pedido por teléfono, aparece aquí con su número del día.</div>`}
    ${otros.length ? `<h2>Pendientes de otro día</h2><div class="tablero">${otros.map((p) => tarjeta(p, false)).join("")}</div>` : ""}
  `;
  app.querySelectorAll(".entregar").forEach((b) => {
    b.onclick = () => entregar(b.dataset.id);
  });
}

cargar();
setInterval(cargar, 4000);
</script>
</body>
</html>
