<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1b2744" />
<title>Pedidos · Mayoreo</title>
<style>
  :root {
    --navy: #1b2744;
    --ink: #1c2433;
    --muted: #6b7380;
    --line: #e6e8ee;
    --bg: #f4f6f8;
    --card: #fff;
    --green: #178a4a;
    --red: #b42318;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    min-height: 100%;
  }
  .barra {
    width: 108px;
    flex: 0 0 108px;
    background: var(--navy);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0.8rem 0.55rem 0.7rem;
    gap: 0.45rem;
  }
  .logo {
    width: 76px;
    height: 76px;
    border-radius: 18px;
    display: block;
  }
  nav { display: flex; flex-direction: column; gap: 0.35rem; width: 100%; margin-top: 0.4rem; }
  nav button, .pie button {
    font: inherit;
    border: 0;
    border-radius: 12px;
    cursor: pointer;
  }
  nav button {
    background: transparent;
    color: #d5dceb;
    padding: 0.7rem 0.3rem;
    font-weight: 700;
    font-size: 0.82rem;
  }
  nav button.on { background: rgba(255,255,255,0.14); color: #fff; }
  .pie { margin-top: auto; width: 100%; }
  .pie button {
    width: 100%;
    background: #2a3858;
    color: #fff;
    padding: 0.7rem 0.3rem;
    font-weight: 700;
    font-size: 0.82rem;
  }
  .pie button.on { background: rgba(255,255,255,0.14); }
  .ajustes { max-width: 420px; display: flex; flex-direction: column; gap: 0.55rem; }
  .ajustes h2 { margin: 0 0 0.2rem; color: var(--ink); font-size: 1rem; }
  .sonido {
    text-align: left;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 0.85rem 1rem;
    font: inherit;
    font-weight: 750;
    cursor: pointer;
  }
  .sonido.on { border-color: var(--navy); background: #eef2f8; }
  .probar-sonido, .guardar-cambios {
    margin-top: 0.35rem;
    min-height: 48px;
    border-radius: 14px;
    font: inherit;
    font-weight: 800;
    cursor: pointer;
  }
  .probar-sonido { border: 1px solid var(--navy); background: #fff; color: var(--navy); }
  .guardar-cambios { border: 0; background: var(--navy); color: #fff; }
  .lienzo { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .tope {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    padding: 0.85rem 1rem 0.4rem;
  }
  .tope h1 { margin: 0; font-size: 1.35rem; font-weight: 750; letter-spacing: -0.02em; }
  #sub { margin: 0.15rem 0 0; color: var(--muted); font-size: 0.92rem; }
  .tope-derecha {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  #dia-historial {
    display: none;
    font: inherit;
    font-weight: 700;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 0.4rem 0.55rem;
    min-height: 42px;
    background: #fff;
    color: var(--ink);
  }
  #dia-historial.ver { display: block; }
  .cuenta {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.35rem 0.75rem;
    font-weight: 800;
    font-size: 0.9rem;
  }
  .flash {
    display: none;
    margin: 0 1rem;
    background: #1b2744;
    color: #fff;
    font-weight: 800;
    text-align: center;
    border-radius: 12px;
    padding: 0.55rem;
  }
  .flash.show { display: block; }
  main { padding: 0.7rem 1rem 1.4rem; }
  .tablero {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 0.75rem;
  }
  .ticket {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 0.85rem 0.9rem 0.8rem;
    display: flex;
    flex-direction: column;
    min-height: 196px;
  }
  .ticket.nuevo { border-color: #f0b429; }
  .cabeza { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
  .folio { font-size: 1.55rem; font-weight: 800; letter-spacing: -0.03em; }
  .estado {
    font-size: 0.75rem;
    font-weight: 800;
    border-radius: 999px;
    padding: 0.2rem 0.5rem;
    background: #fff4e5;
    color: #9a5300;
  }
  .estado.entregado { background: #e8f7ee; color: var(--green); }
  .estado.cancelado { background: #fdecea; color: var(--red); }
  .quien { margin-top: 0.55rem; font-size: 1.12rem; font-weight: 800; line-height: 1.2; }
  .tel { color: var(--navy); font-weight: 700; text-decoration: none; font-size: 0.98rem; }
  .prod { margin-top: 0.55rem; font-weight: 650; white-space: pre-line; line-height: 1.35; }
  .detalle { color: var(--muted); margin-top: 0.25rem; white-space: pre-line; font-size: 0.92rem; }
  .hora { color: var(--muted); font-size: 0.82rem; margin-top: auto; padding-top: 0.55rem; }
  .acciones { display: flex; gap: 0.45rem; margin-top: 0.7rem; }
  .entregar {
    flex: 1;
    min-height: 46px;
    border: 0;
    border-radius: 12px;
    background: var(--green);
    color: #fff;
    font: inherit;
    font-weight: 800;
    cursor: pointer;
  }
  .basura {
    flex: 0 0 46px;
    width: 46px;
    height: 46px;
    border: 1px solid #f0c2be;
    border-radius: 12px;
    background: #fff;
    color: var(--red);
    padding: 0;
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .fondo {
    position: fixed;
    inset: 0;
    background: rgba(18, 24, 38, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    padding: 1rem;
  }
  .fondo[hidden] { display: none; }
  .dialogo {
    background: #fff;
    border-radius: 16px;
    padding: 1.15rem;
    width: min(380px, 100%);
  }
  .dialogo p { margin: 0 0 1rem; font-weight: 750; font-size: 1.05rem; line-height: 1.35; }
  .dialogo .fila { display: flex; gap: 0.5rem; }
  .dialogo button { flex: 1; min-height: 46px; border-radius: 12px; font: inherit; font-weight: 800; cursor: pointer; }
  .dialogo .no { border: 1px solid var(--line); background: #fff; color: var(--ink); }
  .dialogo .si { border: 0; background: var(--red); color: #fff; }
  h2 { font-size: 0.9rem; color: var(--muted); margin: 1rem 0 0.5rem; }
  .vacio { text-align: center; color: var(--muted); padding: 2.5rem 1rem; }
  .setup { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 1rem; max-width: 520px; }
  label { display: block; font-weight: 750; margin-bottom: 0.3rem; }
  input { width: 100%; font: inherit; padding: 0.75rem; border-radius: 12px; border: 1px solid var(--line); }
  .hint { color: var(--muted); }
  button.primary { margin-top: 0.7rem; width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: var(--navy); color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
  .err { color: var(--red); font-weight: 700; }
</style>
</head>
<body>
<aside class="barra">
  <img class="logo" src="logo.png" alt="Mayoreo de Carne de Res" width="76" height="76" />
  <nav>
    <button type="button" class="on" data-vista="curso">En curso</button>
    <button type="button" data-vista="cerrados">Cerrados</button>
    <button type="button" data-vista="quejas">Quejas</button>
  </nav>
  <div class="pie">
    <button type="button" id="btn-ajustes">Ajustes</button>
  </div>
</aside>
<div class="lienzo">
  <div class="tope">
    <div>
      <h1 id="titulo">Pedidos de hoy</h1>
      <p id="sub">Mayoreo de Carne de Res</p>
    </div>
    <div class="tope-derecha">
      <input type="date" id="dia-historial" aria-label="Día del historial" />
      <div class="cuenta" id="cuenta">0</div>
    </div>
  </div>
  <div class="flash" id="flash">Llegó un pedido</div>
  <main id="app"></main>
</div>
<div class="fondo" id="confirmar" hidden>
  <div class="dialogo" role="dialog" aria-modal="true" aria-labelledby="confirmar-texto">
    <p id="confirmar-texto">¿Cancelar este pedido?</p>
    <div class="fila">
      <button type="button" class="no" id="confirmar-no">No, dejarlo</button>
      <button type="button" class="si" id="confirmar-si">Sí, cancelar</button>
    </div>
  </div>
</div>
<script>
const PROYECTO = "https://pambysjusmroryomhiwt.supabase.co";
const CLAVE_KEY = "angie-tablet-anon";
const SONIDO_KEY = "angie-tablet-sonido";
let clave = localStorage.getItem(CLAVE_KEY) || "";
let vista = "curso";
let ajustesPintado = false;
let sonido = false;
let tipoSonido = localStorage.getItem(SONIDO_KEY) || "alarma";
let sonidoElegido = tipoSonido;
let cancelarId = null;
let conocidos = null;
let audioCtx = null;
let diaHistorial = "";

const app = document.getElementById("app");
const sub = document.getElementById("sub");
const cuenta = document.getElementById("cuenta");
const titulo = document.getElementById("titulo");
const flash = document.getElementById("flash");
const btnAjustes = document.getElementById("btn-ajustes");
const diaInput = document.getElementById("dia-historial");
const sonidos = [
  ["alarma", "Alarma"],
  ["timbre", "Timbre"],
  ["sirena", "Sirena"],
  ["campana", "Campana"],
  ["golpes", "Golpes"]
];
if (!sonidos.some((s) => s[0] === tipoSonido)) tipoSonido = "alarma";

function marcarMenus() {
  document.querySelectorAll("nav button").forEach((x) => x.classList.toggle("on", x.dataset.vista === vista));
  btnAjustes.classList.toggle("on", vista === "ajustes");
}

document.querySelectorAll("nav button").forEach((b) => {
  b.onclick = () => {
    vista = b.dataset.vista;
    marcarMenus();
    conocidos = null;
    cargar();
  };
});

btnAjustes.onclick = () => {
  vista = "ajustes";
  sonidoElegido = tipoSonido;
  ajustesPintado = false;
  marcarMenus();
  cargar();
};

function pintarAjustes() {
  titulo.textContent = "Ajustes";
  sub.textContent = "Elige el sonido del aviso";
  cuenta.textContent = "";
  app.innerHTML = `<div class="ajustes">
    <h2>Sonido</h2>
    ${sonidos.map(([id, nombre]) => `<button type="button" class="sonido ${id === sonidoElegido ? "on" : ""}" data-sonido="${id}">${nombre}</button>`).join("")}
    <button type="button" class="probar-sonido" id="probar-sonido">Probar sonido</button>
    <button type="button" class="guardar-cambios" id="guardar-sonido">Guardar cambios</button>
  </div>`;
  app.querySelectorAll(".sonido").forEach((b) => {
    b.onclick = () => {
      sonidoElegido = b.dataset.sonido;
      pintarAjustes();
    };
  });
  document.getElementById("probar-sonido").onclick = () => {
    const anterior = tipoSonido;
    tipoSonido = sonidoElegido;
    armarSonido(true);
    tipoSonido = anterior;
  };
  document.getElementById("guardar-sonido").onclick = () => {
    tipoSonido = sonidoElegido;
    localStorage.setItem(SONIDO_KEY, tipoSonido);
    sub.textContent = "Cambios guardados";
  };
};

function nota(inicio, frecuencia, duracion, volumen, tipo) {
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = tipo || "square";
  o.frequency.setValueAtTime(frecuencia, inicio);
  g.gain.setValueAtTime(0.0001, inicio);
  g.gain.exponentialRampToValueAtTime(volumen, inicio + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, inicio + duracion);
  o.connect(g).connect(audioCtx.destination);
  o.start(inicio);
  o.stop(inicio + duracion + 0.02);
}

function tono(cual) {
  if (!audioCtx) return;
  const tipo = cual || tipoSonido;
  const t = audioCtx.currentTime;
  if (tipo === "timbre") {
    nota(t, 523, 0.45, 0.7, "triangle");
    nota(t + 0.5, 659, 0.7, 0.75, "triangle");
  } else if (tipo === "sirena") {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(480, t);
    o.frequency.linearRampToValueAtTime(1400, t + 0.45);
    o.frequency.linearRampToValueAtTime(480, t + 0.9);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.45, t + 0.04);
    g.gain.setValueAtTime(0.45, t + 0.82);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.95);
    o.connect(g).connect(audioCtx.destination);
    o.start(t);
    o.stop(t + 1);
  } else if (tipo === "campana") {
    [0, 0.35, 0.7].forEach((d) => nota(t + d, 880, 0.45, 0.8, "sine"));
  } else if (tipo === "golpes") {
    [0, 0.18, 0.36, 0.54].forEach((d) => nota(t + d, 180, 0.12, 0.9, "square"));
  } else {
    [0, 0.16, 0.32, 0.48, 0.64, 0.8].forEach((d, i) => nota(t + d, i % 2 ? 988 : 784, 0.12, 0.55, "square"));
  }
}

function dia(iso) {
  return new Date(iso || Date.now()).toLocaleDateString("en-CA", { timeZone: "America/Chihuahua" });
}

function etiquetaDia(clave) {
  const partes = String(clave || "").split("-");
  if (partes.length !== 3) return clave;
  const dt = new Date(Date.UTC(Number(partes[0]), Number(partes[1]) - 1, Number(partes[2]), 12));
  return dt.toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" });
}

diaInput.onchange = () => {
  if (diaInput.value) {
    diaHistorial = diaInput.value;
    cargar();
  }
};

function hora(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit", timeZone: "America/Chihuahua" });
}

function grupos(tel) {
  const d = String(tel || "").replace(/\D/g, "");
  const n = d.length > 10 ? d.slice(-10) : d;
  if (n.length !== 10) return tel || "";
  return n.slice(0, 3) + " " + n.slice(3, 6) + " " + n.slice(6);
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function api(path, opts = {}) {
  const res = await fetch(PROYECTO + "/rest/v1/" + path, {
    method: opts.method || "GET",
    headers: {
      apikey: clave,
      Authorization: "Bearer " + clave,
      "Content-Type": "application/json",
      Prefer: "return=minimal"
    },
    body: opts.body
  });
  if (!res.ok) {
    const t = await res.text();
    return { ok: false, error: t.slice(0, 180) || ("HTTP " + res.status) };
  }
  const txt = await res.text();
  let data = [];
  try { data = txt ? JSON.parse(txt) : []; } catch { data = []; }
  return { ok: true, data };
}

function pintarSetup(msg) {
  diaInput.classList.remove("ver");
  titulo.textContent = "Pedidos de hoy";
  sub.textContent = "Falta la clave pública";
  cuenta.textContent = "–";
  app.innerHTML = `<div class="setup">
    <label>Clave pública de la cuenta provisional</label>
    <p class="hint">En Supabase: Project Settings → API Keys. Pega la clave <strong>anon</strong>. No pegues la clave secreta.</p>
    <input id="clave" autocomplete="off" placeholder="eyJ..." />
    <button class="primary" id="guardar-clave" type="button">Guardar y entrar</button>
    ${msg ? `<p class="err">${esc(msg)}</p>` : ""}
  </div>`;
  document.getElementById("guardar-clave").onclick = () => {
    const v = document.getElementById("clave").value.trim();
    if (!v) return;
    localStorage.setItem(CLAVE_KEY, v);
    clave = v;
    conocidos = null;
    cargar();
  };
}

function ticket(p, nueva, accion) {
  const tel = String(p.telefono || "").replace(/\D/g, "");
  const telHtml = tel ? `<a class="tel" href="tel:${esc(tel)}">${esc(grupos(tel))}</a>` : `<div class="detalle">Sin teléfono</div>`;
  const num = p.numero != null ? esc(p.numero) : "–";
  const etiqueta = p.estado === "entregado" ? "Entregado" : p.estado === "cancelado" ? "Cancelado" : "En curso";
  return `<article class="ticket ${nueva ? "nuevo" : ""}">
    <div class="cabeza">
      <div class="folio">#${num}</div>
      <span class="estado ${esc(p.estado || "")}">${etiqueta}</span>
    </div>
    <div class="quien">${esc(p.nombre || "Sin nombre")}</div>
    ${telHtml}
    <div class="prod">${esc(p.producto || "")}</div>
    ${p.detalle ? `<div class="detalle">${esc(p.detalle)}</div>` : ""}
    <div class="hora">${esc(hora(p.creado))}</div>
    ${accion ? `<div class="acciones">
      <button class="entregar" type="button" data-id="${p.id}">Entregado</button>
      <button class="basura" type="button" data-id="${p.id}" data-num="${num}" data-nombre="${esc(p.nombre || "Sin nombre")}" aria-label="Cancelar pedido">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M9 3h6l1 2h5v2H3V5h5l1-2zm-1 6h2v9H8V9zm4 0h2v9h-2V9zm4 0h2v9h-2V9zM6 9h1l1 12h8l1-12h1v-2H6v2z"/></svg>
      </button>
    </div>` : ""}
  </article>`;
}

function abrirCancelar(id, num, nombre) {
  cancelarId = id;
  document.getElementById("confirmar-texto").textContent = "¿Cancelar el pedido #" + num + " de " + nombre + "?";
  document.getElementById("confirmar").hidden = false;
}

function cerrarCancelar() {
  cancelarId = null;
  document.getElementById("confirmar").hidden = true;
}

async function confirmarCancelar() {
  const id = cancelarId;
  if (!id) return;
  const boton = document.getElementById("confirmar-si");
  boton.disabled = true;
  const r = await api("pedidos_telefono?id=eq." + encodeURIComponent(id), {
    method: "PATCH",
    body: JSON.stringify({ estado: "cancelado", cancelado_en: new Date().toISOString() })
  });
  boton.disabled = false;
  cerrarCancelar();
  if (!r.ok) alert(r.error || "No se pudo cancelar.");
  else cargar();
}

document.getElementById("confirmar-no").onclick = cerrarCancelar;
document.getElementById("confirmar-si").onclick = confirmarCancelar;
document.getElementById("confirmar").onclick = (e) => {
  if (e.target.id === "confirmar") cerrarCancelar();
};

async function entregar(id) {
  const r = await api("pedidos_telefono?id=eq." + encodeURIComponent(id), {
    method: "PATCH",
    body: JSON.stringify({ estado: "entregado", entregado_en: new Date().toISOString() })
  });
  if (!r.ok) alert(r.error || "No se pudo marcar.");
  else cargar();
}

async function cargarQuejas() {
  diaInput.classList.remove("ver");
  titulo.textContent = "Quejas";
  const r = await api("quejas?select=*&order=creado.desc&limit=40");
  if (!r.ok) {
    sub.textContent = "Apartado no disponible";
    cuenta.textContent = "0";
    app.innerHTML = `<div class="vacio">Todavía no está el apartado de quejas.</div>`;
    return;
  }
  const rows = Array.isArray(r.data) ? r.data : [];
  const pend = rows.filter((q) => q.estado !== "revisada");
  sub.textContent = pend.length ? "Pendientes de revisar" : "Sin quejas";
  cuenta.textContent = String(pend.length);
  app.innerHTML = pend.length ? `<div class="tablero">${pend.map((q) => `<article class="ticket">
    <div class="quien">${esc(q.nombre || "Sin nombre")}</div>
    <div class="detalle">${esc(q.telefono || "Sin teléfono")}</div>
    <div class="prod">${esc(q.queja || "")}</div>
    <div class="hora">${esc(hora(q.creado))}</div>
    <button class="entregar" type="button" data-id="${q.id}">Revisada</button>
  </article>`).join("")}</div>` : `<div class="vacio">Cuando alguien se queje por teléfono, aparece aquí.</div>`;
  app.querySelectorAll(".entregar").forEach((b) => {
    b.onclick = async () => {
      await api("quejas?id=eq." + encodeURIComponent(b.dataset.id), {
        method: "PATCH",
        body: JSON.stringify({ estado: "revisada" })
      });
      cargar();
    };
  });
}

async function cargar() {
  if (!clave) {
    if (vista === "ajustes") {
      if (!ajustesPintado) { pintarAjustes(); ajustesPintado = true; }
      return;
    }
    pintarSetup();
    return;
  }
  if (vista === "ajustes" && !ajustesPintado) { pintarAjustes(); ajustesPintado = true; }
  if (vista === "quejas") return cargarQuejas();
  const r = await api("pedidos_telefono?select=*&order=creado.desc&limit=500");
  if (!r.ok) {
    if (vista === "ajustes") return;
    pintarSetup("Esa clave no pudo leer los pedidos. Usa la clave pública, no la secreta.");
    return;
  }
  const rows = Array.isArray(r.data) ? r.data : [];
  const hoy = dia();
  if (!diaHistorial) diaHistorial = hoy;
  const pendientes = rows.filter((p) => p.estado === "pendiente");
  const deHoy = pendientes.filter((p) => dia(p.creado) === hoy).sort((a, b) => (a.numero || 0) - (b.numero || 0));
  const otros = pendientes.filter((p) => dia(p.creado) !== hoy);
  const historial = rows.filter((p) => p.estado !== "borrador" && dia(p.creado) === diaHistorial)
    .sort((a, b) => (a.numero || 0) - (b.numero || 0));
  const ids = new Set(deHoy.map((p) => p.id));
  const nuevos = new Set();
  if (conocidos) {
    for (const id of ids) if (!conocidos.has(id)) nuevos.add(id);
    if (nuevos.size) {
      flash.classList.add("show");
      sonarAviso();
      setTimeout(() => flash.classList.remove("show"), 4000);
    }
  }
  if (vista === "curso" || vista === "ajustes") conocidos = ids;
  if (vista === "ajustes") {
    diaInput.classList.remove("ver");
    return;
  }

  if (vista === "cerrados") {
    diaInput.classList.add("ver");
    if (diaInput.value !== diaHistorial) diaInput.value = diaHistorial;
    const esHoy = diaHistorial === hoy;
    titulo.textContent = esHoy ? "Historial de hoy" : "Historial";
    sub.textContent = etiquetaDia(diaHistorial);
    cuenta.textContent = String(historial.length);
    app.innerHTML = historial.length
      ? `<div class="tablero">${historial.map((p) => ticket(p, false, false)).join("")}</div>`
      : `<div class="vacio">${esHoy ? "Hoy todavía no hay pedidos en el historial." : "Ese día no hay pedidos."}</div>`;
    return;
  }

  diaInput.classList.remove("ver");

  titulo.textContent = "Pedidos de hoy";
  sub.textContent = deHoy.length ? "En curso, de izquierda a derecha" : "Sin pendientes hoy";
  cuenta.textContent = String(deHoy.length);
  app.innerHTML = `
    ${deHoy.length ? `<div class="tablero">${deHoy.map((p) => ticket(p, nuevos.has(p.id), true)).join("")}</div>` : `<div class="vacio">Cuando entre un pedido por teléfono, aparece aquí con su número del día.</div>`}
    ${otros.length ? `<h2>Pendientes de otro día</h2><div class="tablero">${otros.map((p) => ticket(p, false, true)).join("")}</div>` : ""}
  `;
  app.querySelectorAll(".entregar").forEach((b) => { b.onclick = () => entregar(b.dataset.id); });
  app.querySelectorAll(".basura").forEach((b) => {
    b.onclick = () => abrirCancelar(b.dataset.id, b.dataset.num, b.dataset.nombre);
  });
}

function armarSonido(conTono) {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  const seguir = () => {
    sonido = true;
    if (conTono) tono();
  };
  const p = audioCtx.resume();
  if (p && typeof p.then === "function") p.then(seguir).catch(seguir);
  else seguir();
}

function sonarAviso() {
  if (!sonido || !audioCtx) return;
  const disparar = () => tono();
  if (audioCtx.state === "suspended") {
    const p = audioCtx.resume();
    if (p && typeof p.then === "function") p.then(disparar).catch(disparar);
    else disparar();
  } else {
    disparar();
  }
}

// El navegador exige un gesto para habilitar audio: el primer toque lo activa
document.addEventListener("pointerdown", () => { if (!sonido) armarSonido(false); });
// Mantener vivo el contexto de audio en kioskos
setInterval(() => { if (sonido && audioCtx && audioCtx.state === "suspended") audioCtx.resume(); }, 5000);

cargar();
setInterval(cargar, 4000);
</script>
